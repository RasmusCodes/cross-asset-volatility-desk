name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]   # the pinned numpy 2.5 needs Python >= 3.12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Tests (synthetic data only; no WRDS access in CI)
        run: pytest -q

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check the demo's ES modules
        run: |
          mkdir -p /tmp/jscheck
          for f in demo/app/*.js; do
            cp "$f" "/tmp/jscheck/$(basename "$f" .js).mjs"
            node --check "/tmp/jscheck/$(basename "$f" .js).mjs"
          done
      - name: Validate the demo's JSON bundle
        run: |
          for f in $(find demo/data -name '*.json'); do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
